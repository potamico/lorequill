version: 2

updates:
  # npm workspaces: one lockfile in the repository root covers all packages.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Do not adopt a release in its first week; this gives the community time to find a bad or
    # compromised release. Security updates are not delayed.
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Low-risk updates of development tooling arrive as one pull request.
      development-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime-minor-and-patch:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only (see docs/development.md).
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # The minimum supported Node.js is 22, so the type definitions stay on that line.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # The VS Code type definitions must match `engines.vscode` of the extension. They are
      # raised together with it, deliberately and by hand.
      - dependency-name: "@types/vscode"

  # Workflow actions are pinned to commit SHAs; Dependabot proposes the next pinned commit.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
