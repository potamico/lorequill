name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# A newer run for the same branch or pull request makes an older one obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Current LTS on all platforms, plus the minimum supported Node.js on Linux.
          - { os: ubuntu-latest, node: "lts/*" }
          - { os: windows-latest, node: "lts/*" }
          - { os: macos-latest, node: "lts/*" }
          - { os: ubuntu-latest, node: "22" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Typecheck, lint, format check, build, and unit tests. No VS Code needed.
      - run: npm run verify

  integration:
    name: Extension host tests (${{ matrix.os }}, VS Code ${{ matrix.vscode }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The current stable release on all platforms, plus the minimum version of
        # `engines.vscode` on Linux (a unit test keeps the two in step).
        include:
          - { os: ubuntu-latest, vscode: stable }
          - { os: windows-latest, vscode: stable }
          - { os: macos-latest, vscode: stable }
          - { os: ubuntu-latest, vscode: "1.110.0" }
    env:
      LOREQUILL_VSCODE_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Downloads a stable VS Code build and runs the tests inside its extension host.
      - name: Run tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Run tests
        if: runner.os != 'Linux'
        run: npm run test:integration

  action:
    name: Checks Action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The committed bundle is what workflows run; it must be exactly the build of this commit.
      - run: npm run build -w @lorequill/checks
      - name: Check that action/dist is up to date
        run: git diff --exit-code -- action/dist
      # Runs the Action as a workflow uses it, on the demo repository.
      - id: checks
        uses: ./action
        with:
          path: samples/demo
          sarif-file: lorequill.sarif
      - name: Check the outputs
        env:
          ENGINE_VERSION: ${{ steps.checks.outputs.engine-version }}
          STATUS: ${{ steps.checks.outputs.status }}
        run: |
          expected="$(node -p "require('./packages/checks/package.json').version")"
          echo "Engine $ENGINE_VERSION, status $STATUS"
          test "$ENGINE_VERSION" = "$expected"
          test "$STATUS" = "passed"
          test -s lorequill.sarif
      # Lorequill checks its own documentation with the root profile (.lorequill/config.yaml).
      - name: Check the documentation
        uses: ./action

  webview:
    name: Webview tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # The browser build matches the pinned @playwright/test version, so the version is the key.
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The editor webview in Chromium, the engine of VS Code's webviews, with a simulated host.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:webview
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webview-test-results
          path: test-results
          retention-days: 7

  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      # Fails on broken links, missing anchors, and pages missing from the navigation.
      - run: mkdocs build --strict

  # Builds the same site with Zensical, the successor of Material for MkDocs (decision D35), to
  # find incompatibilities before the move. Not part of "CI passed": a failure is visible but does
  # not block a merge. The built site is kept as an artifact for comparison.
  zensical:
    name: Documentation site (Zensical preview)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: docs/requirements-zensical.txt
      - run: pip install -r docs/requirements-zensical.txt
      # Reads mkdocs.yml; --strict fails on missing pages and anchors, like the MkDocs build.
      - run: zensical build --strict
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-zensical
          path: site
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Packages twice and compares the content digests: the VSIX builds reproducibly.
      - name: Package and verify
        run: |
          npm run package 2>&1 | tee first.log
          npm run package 2>&1 | tee second.log
          first="$(grep -o 'content digest [0-9a-f]*' first.log)"
          second="$(grep -o 'content digest [0-9a-f]*' second.log)"
          test -n "$first"
          test "$first" = "$second"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: dist/*.vsix
          if-no-files-found: error
          retention-days: 14

  audit:
    name: Audit runtime dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Advisories that only affect development tooling are tracked in docs/development.md.
      - run: npm audit --omit=dev

  # One stable name for branch protection: require this job instead of every matrix entry.
  ci-passed:
    name: CI passed
    if: always()
    needs: [verify, integration, webview, action, docs, package, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Check the results of all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "At least one job did not succeed."
              exit 1
            fi
          done
